name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # THIS IS WHERE YOUR ENVIRONMENT VARIABLES ARE INJECTED
      - name: Build Project
        run: npm run build
        env:
          VITE_PAT: ${{ secrets.VITE_PAT }} # Swap out for your framework variable name
          VITE_BASE_ID: ${{ secrets.VITE_BASE_ID }} # Swap out for your framework variable name
          VITE_TABLE_NAME: ${{ secrets.VITE_TABLE_NAME }} # Swap out for your framework variable name

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Change to './build' or './out' depending on your framework's output folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
